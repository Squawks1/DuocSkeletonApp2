<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-segment [(ngModel)]="segmentValue">
    <ion-segment-button value="misdatos">Mis Datos</ion-segment-button>
    <ion-segment-button value="exp">Experiencia Laboral</ion-segment-button>
    <ion-segment-button value="cert">Certificaciones</ion-segment-button>
  </ion-segment>

  <div [ngSwitch]="segmentValue">
    <app-mis-datos *ngSwitchCase="'misdatos'"></app-mis-datos>
    <app-experiencia-laboral *ngSwitchCase="'exp'"></app-experiencia-laboral>
    <app-certificaciones *ngSwitchCase="'cert'"></app-certificaciones>
  </div>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Funciones del Proyecto</ion-card-title>
      </ion-card-header>

      <ion-card-content>

        <ion-button expand="block" (click)="verUsuarios()">
          Ver Usuarios
        </ion-button>

        <ion-button expand="block" color="success" (click)="verMapa()">
          Ver Mapa
        </ion-button>

        <ion-button expand="block" color="warning" (click)="verCamara()">
          Abrir Cámara
        </ion-button>

      </ion-card-content>
    </ion-card>


  <ion-button expand="block" color="danger" (click)="logout()">Cerrar Sesión</ion-button>

</ion-content>
